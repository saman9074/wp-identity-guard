# WP Identity Guard (Free) — Continuous Integration Workflow
# Security & Supply-Chain Invariants:
# - Least-privilege permissions (`contents: read` at workflow level).
# - Third-party actions pinned to immutable full 40-char commit SHAs.
# - Zero real provider credentials, zero encryption secrets, and zero real PII in CI.
# - All tests run completely offline against synthetic test vectors or local MariaDB service.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-security-checks:
    name: Offline Syntax & Sensitive-Data Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, openssl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json & composer.lock
        run: composer validate --strict

      - name: Check git diff whitespace hygiene
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Run PHP syntax lint & sensitive-data scan
        run: composer check:offline

  static-analysis-and-unit-tests:
    name: PHPCS, PHPStan & PHPUnit Unit (PHP ${{ matrix.php }})
    needs: offline-and-security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, openssl, intl
          coverage: none
          tools: composer:v2

      - name: Install locked development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Composer dependency security audit
        run: composer audit --no-interaction

      - name: Run WordPress Coding Standards (PHPCS)
        run: composer cs

      - name: Run PHPStan level 6 static analysis
        run: composer stan

      - name: Run PHPUnit unit test suite
        run: composer test:unit

  wordpress-mariadb-integration:
    name: WordPress + MariaDB Integration Suite (PHP 8.3)
    needs: static-analysis-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11.18
        env:
          MARIADB_ROOT_PASSWORD: wpig_ci_root_test_only
          MARIADB_DATABASE: wpig_test
          MARIADB_USER: wpig_test
          MARIADB_PASSWORD: wpig_ci_user_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up PHP 8.3 with mysqli & WP-CLI
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, openssl, mysqli, pdo_mysql
          coverage: none
          tools: composer:v2, wp-cli

      - name: Install locked development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Bootstrap disposable WordPress core against MariaDB service
        run: |
          mkdir -p /tmp/wp-core
          wp core download --path=/tmp/wp-core --version=latest --skip-content
          wp config create \
            --path=/tmp/wp-core \
            --dbname=wpig_test \
            --dbuser=wpig_test \
            --dbpass=wpig_ci_user_test_only \
            --dbhost=127.0.0.1:3306 \
            --skip-check \
            --extra-php="define( 'WPIG_TEST_MODE', true ); define( 'WPIG_BLOCK_EXTERNAL_HTTP', true );"
          wp core install \
            --path=/tmp/wp-core \
            --url="https://example.invalid" \
            --title="WPIG CI Integration Test" \
            --admin_user="wpig_ci_admin" \
            --admin_password="wpig_ci_admin_test_only_password" \
            --admin_email="admin@example.invalid" \
            --skip-email

      - name: Run PHPUnit WordPress/MariaDB integration test suite
        env:
          WPIG_INTEGRATION_BOOTSTRAP: '1'
          WPIG_WP_LOAD_PATH: '/tmp/wp-core/wp-load.php'
        run: ./vendor/bin/phpunit --testsuite integration
